<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <!-- Rutas absolutas: el dominio definitivo es https://www.fortunekids.org (raíz) -->
    <title>Page not found | Fortune Kids</title>

    <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">

    <style>
        .error-404 { min-height: 60vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: var(--space-16) var(--space-4); padding-top: calc(80px + var(--space-16)); }
        .error-404__code { font-family: var(--font-display); font-size: clamp(96px, 20vw, 160px); font-weight: var(--font-bold); line-height: 1; color: var(--color-primary-600); margin-bottom: var(--space-2); }
        .error-404 p { max-width: 420px; margin: 0 auto var(--space-8); color: var(--color-neutral-600); }
        .error-404__actions { display: flex; gap: var(--space-3); flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>
    <main class="error-404">
        <div>
            <p class="error-404__code" aria-hidden="true">404</p>
            <h1>Page not found</h1>
            <p>Sorry, the page you are looking for does not exist or has been moved.</p>
            <div class="error-404__actions">
                <a href="/" class="btn btn--primary btn--lg">Back to home</a>
                <a href="/pages/contenidos.html" class="btn btn--secondary btn--lg">See stories &amp; news</a>
            </div>
        </div>
    </main>
</body>
</html>
